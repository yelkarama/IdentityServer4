services:
  identityserver:
    build:
      context: .
      dockerfile: Dockerfile.identityserver-local
    container_name: oscar-idp
    ports:
      - "5555:5555"
    environment:
      - ASPNETCORE_URLS=http://+:5555
      - ASPNETCORE_ENVIRONMENT=Development
      - DATAPROTECTION_KEYS_DIR=/app/dp-keys
      - IS_SIGNING_KEY_PATH=/root/.identityserver/tempkey.jwk
      - IS_GRANTS_DB_PATH=/app/db/idp.db
    volumes:
      - dp-keys:/app/dp-keys
      - is-keys:/root/.identityserver
      - is-grants:/app/db
    networks:
      - oscar-network
    restart: always

networks:
  oscar-network:
    driver: bridge

volumes:
  dp-keys:
    name: idp_dp-keys
  is-keys:
    name: idp_is-keys
  is-grants:
    name: idp_is-grants
