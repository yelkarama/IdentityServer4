services:
  identityserver:
    build:
      context: .
      dockerfile: Dockerfile.identityserver-local
    container_name: oscar-idp
    ports:
      - "5555:5555"
    environment:
      - ASPNETCORE_URLS=http://+:5555
      - ASPNETCORE_ENVIRONMENT=Development
      - DATAPROTECTION_KEYS_DIR=/app/dp-keys
      - IS_SIGNING_KEY_PATH=/root/.identityserver/tempkey.jwk
    volumes:
      - dp-keys:/app/dp-keys
      - is-keys:/root/.identityserver
    networks:
      - oscar-network
    restart: always

networks:
  oscar-network:
    driver: bridge

volumes:
  # Pre-existing daemon volumes (no compose labels); external so compose
  # adopts them instead of warning. Holds DP + signing keys — don't recreate.
  dp-keys:
    external: true
    name: idp_dp-keys
  is-keys:
    external: true
    name: idp_is-keys
